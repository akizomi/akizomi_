  <!--
    The image and the arch shapes live in ONE svg with the same coordinate
    system (2560 x 1440 = your image size). They always scale and crop together,
    so each clickable arch stays exactly on top of its arch in the image.
    The arch outlines were traced from the real render (cover-2560.webp).
  -->
  <svg class="cover" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice"
       role="img" aria-label="Portfolio cover: gothic pavilion with five arches">

    <defs>
      <!-- Blue-purple shine used when an arch is hovered -->
      <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#9d8cff" stop-opacity="0.42"/>
        <stop offset="0.5" stop-color="#6f7dff" stop-opacity="0.24"/>
        <stop offset="1"   stop-color="#8a5cff" stop-opacity="0.36"/>
      </linearGradient>
      <!-- Soft glow around the edge of the arch -->
      <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="9" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- The right size is chosen automatically by the script at the bottom -->
    <image id="cover-img" href="images/cover-1920.webp" x="0" y="0" width="2560" height="1440"
           preserveAspectRatio="none"/>

  <!-- Only visible when a phone is held upright -->
  <div class="rotate-msg">

  </div>

  <script>
    // Picks the smallest cover image that still looks sharp on this device,
    // and steps down one size on slow or data-saver connections.
    (function () {
      var files = [
        'images/cover-1280.webp',   // small
        'images/cover-1920.webp',   // medium
        'images/cover-2560.webp'    // large
      ];
      var img = document.getElementById('cover-img');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);   // ignore extra-sharp screens, saves data

      // Width the image needs to cover the screen without being blurry
      var needed = Math.max(window.innerWidth, window.innerHeight * 16 / 9) * dpr;
      var level = needed <= 1280 ? 0 : (needed <= 1920 ? 1 : 2);

      var c = navigator.connection;
      if (c && (c.saveData || /(^|-)(slow-2g|2g|3g)$/.test(c.effectiveType || ''))) {
        level = Math.max(0, level - 1);
      }

      // If a file fails to load, try the other sizes
      var order = [level];
      [1, 0, 2].forEach(function (i) { if (order.indexOf(i) === -1) order.push(i); });
      var tried = 0;
      img.addEventListener('error', function () {
        tried++;
        if (tried < order.length) img.setAttribute('href', files[order[tried]]);
      });
      img.setAttribute('href', files[order[0]]);
    })();

    // Add ?debug=1 to the address to see the arch outlines in red
    if (location.search.indexOf('debug') !== -1) {
      document.body.classList.add('debug');
    }
  </script>
